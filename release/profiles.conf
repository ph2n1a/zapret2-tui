# This is the config with your profiles. For now, you should add strategies to this config yourself.
# For each profile, we use a single profile structure, which has three components: id, name, and NFQWS2_OPT. Let's go through each one in turn:
#
# id is the number of each profile; it determines its order and where it will appear in the interface.
# Its formatting rules are quite simple: the count starts at 0, the maximum number of profiles is 128, and all numbers must be in order
# and must not jump. This component is used only because libconfuse (the library used by zapret-tui)
# does not support dynamic section names; otherwise, each profile in the config would look like profile_n.
#
# name is the most self-explanatory component of the three; it is simply the name of the profile that will be displayed in the program.
# There's not much to say about it.
#
# NFQWS2_OPT is the main component that accepts the strategies you insert into NFQWS2_OPT in the config file
# in zapret2, the formatting rules in this config are probably stricter than in the zapret2 config due to limitations in the libconfuse library:
# - When you move a strategy to a new line, use a backslash "\" 
#
# formatting examples:
#
# profile {
#   id = 0
#   name = "name"
#   NFQWS2_OPT = "--filter-tcp=80 --filter-l7=http <HOSTLIST> --payload=http_req --lua-desync=fake:blob=fake_default_http:tcp_md5 --lua-desync=multisplit:pos=method+2 --new \
#   --filter-tcp=443 --filter-l7=tls <HOSTLIST> --payload=tls_client_hello --lua-desync=fake:blob=fake_default_tls:tcp_md5:tcp_seq=-10000 --lua-desync=multidisorder:pos=1,midsld --new \
#   --filter-udp=443 --filter-l7=quic <HOSTLIST_NOAUTO> --payload=quic_initial --lua-desync=fake:blob=fake_default_quic:repeats=6"
# }
#
# profile {
#   id = 1
#   name = "my profile"
#   NFQWS2_OPT = "
#   --filter-tcp=80 --filter-l7=http --payload=http_req --new \
#   --filter-tcp=443 --filter-l7=tls --payload=tls_client_hello \
#   --lua-desync=wssize:wsize=1:scale=6 \
#   --lua-desync=multidisorder:pos=1 \
#   --filter-udp=443 --filter-l7=quic <HOSTLIST_NOAUTO> --payload=quic_initial --lua-desync=fake:blob=fake_default_quic:repeats=6 \
#   "
# }

profile {
  id = 0
  name = "name"
  NFQWS2_OPT = "--filter-tcp=80 --filter-l7=http <HOSTLIST> --payload=http_req --lua-desync=fake:blob=fake_default_http:tcp_md5 --lua-desync=multisplit:pos=method+2 --new \
  --filter-tcp=442 --filter-l7=tls <HOSTLIST> --payload=tls_client_hello --lua-desync=fake:blob=fake_default_tls:tcp_md5:tcp_seq=-10000 --lua-desync=multidisorder:pos=1,midsld --new \
  --filter-udp=443 --filter-l7=quic <HOSTLIST_NOAUTO> --payload=quic_initial --lua-desync=fake:blob=fake_default_quic:repeats=6"
}
